[project]
name = "acd"
version = "0.1.0"
description = "Companion MCP server (acd): project layout, rule profile, gates, revisions, approvals, backups and release export for the Auto Circuit Designer."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pyyaml>=6.0",
]

[project.scripts]
acd-mcp = "acd.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
